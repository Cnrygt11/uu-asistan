name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Parçaları yeniden üret ve depodakiyle karşılaştır
        run: |
          python -m uuasistan.hazirla
          git diff --exit-code -- data/
      - run: python -m pytest -q
      - run: python scripts/test_seti_dogrula.py
